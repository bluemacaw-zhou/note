version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: mydb
    # 使用命令启动 MongoDB 并启用日志记录
    command: mongod --logpath /var/log/mongodb/mongod.log --logappend
    volumes:
      # 数据目录
      - E:/workspace/docker/mongodb/data:/data/db
      # 配置目录
      - E:/workspace/docker/mongodb/config:/data/configdb
      # 日志目录
      - E:/workspace/docker/mongodb/logs:/var/log/mongodb
    networks:
      - mongodb_network

  # MongoDB Express - Web 管理界面
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb
    networks:
      - mongodb_network

networks:
  mongodb_network:
    driver: bridge